   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243849" x="13.85433" y="26.2998" transform="rotate(-0 13.85433 26.2998)">PROPOSED CLONING WORKFLOW - SCHEMATIC</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243849" x="25.832124" y="71.024154" transform="rotate(-0 25.832124 71.024154)">1  Defined native TFEB template</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243849" x="25.832124" y="92.693749" transform="rotate(-0 25.832124 92.693749)">1,431 nt synthetic dsDNA; NM_007162.3</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 76.134544)">Planned procurement only. Check supplied</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 89.784544)">sequence and stock identity before use.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243849" x="25.832124" y="141.764154" transform="rotate(-0 25.832124 141.764154)">2  High-fidelity PCR</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243849" x="25.832124" y="163.433749" transform="rotate(-0 25.832124 163.433749)">Q5 M0492; 1,457 bp tailed product</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 140.049544)">No-template control; target band</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 153.699544)">purification if amplification is not</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 167.349544)">specific.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243849" x="25.832124" y="212.504154" transform="rotate(-0 25.832124 212.504154)">3  Cleanup and separate double digests</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243849" x="25.832124" y="234.173749" transform="rotate(-0 25.832124 234.173749)">HindIII / BamHI; purify backbone and insert</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 210.789544)">Remove enzymes and residual circular</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 224.921067)">vector; discard short terminal/MCS</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 238.089544)">fragments.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243849" x="25.832124" y="283.244154" transform="rotate(-0 25.832124 283.244154)">4  Directional T4 ligation</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243849" x="25.832124" y="304.913749" transform="rotate(-0 25.832124 304.913749)">4,695 nt backbone + 1,439 nt insert; 3:1 insert:vector</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 281.529544)">Vector-only ligation estimates</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 295.179544)">background. DNA amounts use measured</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 309.846731)">concentrations.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243849" x="25.832124" y="353.984154" transform="rotate(-0 25.832124 353.984154)">5  Transform and select</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243849" x="25.832124" y="375.653749" transform="rotate(-0 25.832124 375.653749)">NEB 5-alpha; kanamycin 30 ug/mL</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 359.094544)">No-DNA control; separate pUC19 competence</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 372.744544)">control uses ampicillin.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243849" x="25.832124" y="424.724154" transform="rotate(-0 25.832124 424.724154)">6  Screen and prepare candidates</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243849" x="25.832124" y="446.393749" transform="rotate(-0 25.832124 446.393749)">Flanking/orientation PCR; miniprep; diagnostic digest</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 424.026731)">Size and orientation screens do not</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 436.659544)">exclude point mutations or a retained</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 450.006848)">stop.</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243849" x="25.832124" y="495.464154" transform="rotate(-0 25.832124 495.464154)">7  Sanger acceptance before cell assays</text>
   </g>
   <g id="text_21">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243849" x="25.832124" y="517.133749" transform="rotate(-0 25.832124 517.133749)">10 primers; full target and both junctions</text>
   </g>
   <g id="text_22">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 493.749544)">Accept unambiguous concordant</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 508.416731)">bidirectional reads. Rescreen or</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243849" transform="translate(415.775862 521.049544)">resequence failures.</text>
   </g>
  </g>
 </g>
